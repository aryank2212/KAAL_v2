name: Integration Tests (GPU)

# Manual only: the job needs a self-hosted CUDA runner. Triggering it on every
# push left runs queued indefinitely when no such runner was registered.
on:
  workflow_dispatch:

jobs:
  gpu:
    name: GPU end-to-end
    runs-on: [self-hosted, gpu]   # requires a self-hosted runner with CUDA
    timeout-minutes: 30
    env:
      KAAL_RUN_GPU_TESTS: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install package
        run: |
          pip install -e ".[ml,dev,server]"
          pip uninstall -y opencv-python && pip install opencv-python-headless
      - name: Smoke-test CUDA
        run: python -c "import torch; assert torch.cuda.is_available(), 'CUDA required'"
      - name: Run full test suite incl. GPU tests
        run: pytest -m "" --cov=MODEL --cov-report=term-missing
