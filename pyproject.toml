[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "kaal"
version = "0.1.0"
description = "Adversarial defense system for drone object detection (FFT dual-stream + swarm coordination)"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "KAAL Team" }]
keywords = ["adversarial-ml", "yolo", "fft", "drone", "computer-vision"]
dependencies = [
    "ultralytics>=8.0.0",
    "torch>=2.0.0",
    "torchvision>=0.15.0",
    "opencv-python>=4.8.0",
    "numpy>=1.24.0",
    "PyYAML>=6.0",
    "matplotlib>=3.7.0",
    "tqdm>=4.65.0",
]

[project.optional-dependencies]
sim = ["airsim>=1.8.1", "pynput>=1.7.6"]
server = ["fastapi>=0.104.0", "uvicorn>=0.24.0"]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.6",
    "mypy>=1.10",
    "httpx>=0.27",
]

[project.scripts]
kaal-pipeline = "MODEL.pipeline:main"

[tool.setuptools]
packages = [
    "MODEL",
    "MODEL.attacks",
    "MODEL.defenses",
    "MODEL.detection",
    "MODEL.evaluation",
    "MODEL.training",
    "MODEL.visualization",
]

[tool.ruff]
line-length = 100
target-version = "py39"
extend-exclude = [
    "MODEL/attacks",
    "MODEL/defenses",
    "MODEL/detection",
    "MODEL/evaluation",
    "MODEL/training",
    "MODEL/user_testing",
    "MODEL/visualization",
]

[tool.ruff.lint]
select = ["E", "F", "W"]
ignore = ["E501"]  # line-length enforced by ruff format, not lint

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-m 'not gpu'"
markers = [
    "gpu: requires ultralytics + torch (set KAAL_RUN_GPU_TESTS=1 to enable)",
]

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
warn_unused_ignores = false
exclude = [
    "SCRIPTS/",
    "Frontend_Backend/",
    "MODEL/attacks/",
    "MODEL/defenses/",
    "MODEL/detection/",
    "MODEL/evaluation/",
    "MODEL/training/",
    "MODEL/visualization/",
    "MODEL/user_testing/",
]
files = ["MODEL", "tests"]

[[tool.mypy.overrides]]
module = ["numpy.*"]
ignore_errors = true
