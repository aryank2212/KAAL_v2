[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "kaal"
version = "0.1.0"
description = "Adversarial defense system for drone object detection (FFT dual-stream + swarm coordination)"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "KAAL Team" }]
keywords = ["adversarial-ml", "yolo", "fft", "drone", "computer-vision"]
# Core = the model-free defense (FFT / temporal / calibration / dataset tools).
# Detectors and training live in the `ml` extra so CPU-only installs and CI
# do not pull ~2 GB of torch.
dependencies = [
    "opencv-python>=4.8.0",
    "numpy>=1.24.0",
    "PyYAML>=6.0",
    "matplotlib>=3.7.0",
    "tqdm>=4.65.0",
]

[project.optional-dependencies]
ml = [
    "torch>=2.0.0",
    "torchvision>=0.15.0",
    "ultralytics>=8.3.0",
    "rfdetr[train]>=1.11",
    "pycocotools>=2.0.7",
    "supervision>=0.25",
    "huggingface_hub>=0.30",
]
# Run an exported RF-DETR (python -m MODEL.export_model) without torch.
onnx = ["onnxruntime>=1.17"]
# Export the production RF-DETR to ONNX / TensorRT / OpenVINO / CoreML ...
export = ["rfdetr[onnx]>=1.11", "onnxruntime>=1.17"]
sim = ["airsim>=1.8.1", "pynput>=1.7.6"]
server = ["fastapi>=0.104.0", "uvicorn>=0.24.0", "psutil>=5.9.0", "websockets>=12.0"]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.6",
    "mypy>=1.10",
    "httpx>=0.27",
    "pycocotools>=2.0.7",
]

[project.scripts]
kaal-pipeline = "MODEL.pipeline:main"
kaal-build-dataset = "MODEL.build_dataset:main"
kaal-train = "MODEL.train_detector:main"
kaal-compare = "MODEL.compare_detectors:main"
kaal-fetch = "MODEL.fetch_datasets:main"
kaal-build-ground-test = "MODEL.build_ground_test:main"
kaal-export = "MODEL.export_model:main"

[tool.setuptools]
packages = [
    "MODEL",
    "MODEL.attacks",
    "MODEL.defenses",
    "MODEL.detection",
    "MODEL.evaluation",
    "MODEL.training",
    "MODEL.visualization",
]

[tool.setuptools.package-data]
# production_weights() reads the registry at runtime
MODEL = ["datasets_registry.yaml"]

[tool.ruff]
line-length = 100
target-version = "py310"
extend-exclude = [
    "MODEL/attacks",
    "MODEL/defenses",
    "MODEL/detection",
    "MODEL/evaluation",
    "MODEL/training",
    "MODEL/user_testing",
    "MODEL/visualization",
]

[tool.ruff.lint]
select = ["E", "F", "W"]
ignore = ["E501"]  # line-length enforced by ruff format, not lint

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-m 'not gpu'"
markers = [
    "gpu: requires ultralytics + torch (set KAAL_RUN_GPU_TESTS=1 to enable)",
]

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
warn_unused_ignores = false
exclude = [
    "SCRIPTS/",
    "Frontend_Backend/dashboard-app/",
    "MODEL/attacks/",
    "MODEL/defenses/",
    "MODEL/detection/",
    "MODEL/evaluation/",
    "MODEL/training/",
    "MODEL/visualization/",
    "MODEL/user_testing/",
]
files = ["MODEL", "tests", "Frontend_Backend/backend"]

[[tool.mypy.overrides]]
module = ["numpy.*"]
ignore_errors = true
